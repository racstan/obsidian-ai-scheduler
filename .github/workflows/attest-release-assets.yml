name: Attest release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: true
        type: string

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
