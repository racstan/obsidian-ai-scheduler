name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: true
        type: string

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A release is only attested if the tagged source passes the same gates as CI.
      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run smoke

      # The attestation covers the files built here, so make sure they are
      # byte-identical to the assets users actually download from the release.
      - name: Verify release assets match the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release-assets
          gh release download "$TAG" --dir .release-assets --pattern main.js --pattern manifest.json --pattern styles.css
          for file in main.js manifest.json styles.css; do
            if ! cmp -s "$file" ".release-assets/$file"; then
              echo "::error::$file in release $TAG does not match the build from the tag"
              exit 1
            fi
          done

      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
